<title>NBA DATA LAB — 시즌별 스탯</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
__BASE_CSS__

  /* ── 리더 타일 ─────────────────────────────────────────── */
  .tiles {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 1px; background: var(--rule);
    border-block: 1px solid var(--rule);
    margin: 22px 0;
  }
  .tile { background: var(--paper); padding: 13px 14px 15px; }
  .tile .tile-label {
    font-family: Oswald, system-ui, sans-serif;
    font-size: 0.68rem; color: var(--ink-3);
    text-transform: uppercase; letter-spacing: 0.1em;
  }
  .tile .tile-value {
    font-family: Oswald, system-ui, sans-serif;
    font-size: 1.7rem; font-weight: 600; line-height: 1.1;
    margin-top: 3px; font-variant-numeric: tabular-nums;
  }
  .tile .tile-sub { font-size: 0.82rem; color: var(--ink-2); margin-top: 1px; }

  /* ── 표: 정렬 가능한 헤더 + 좌측 3열은 텍스트 ───────────── */
  table { white-space: nowrap; }
  thead th { cursor: pointer; user-select: none; }
  thead th:hover { color: var(--accent); }
  thead th:first-child, thead th:nth-child(2), thead th:nth-child(3) { text-align: left; }
  thead th .arrow { font-size: 0.62rem; color: var(--accent); margin-left: 3px; }
  tbody td:first-child, tbody td:nth-child(2), tbody td:nth-child(3) {
    text-align: left; font-variant-numeric: normal;
  }
  .player-name { font-weight: 600; }
  .player-name a { color: inherit; text-decoration: none; }
  .player-name a:hover { color: var(--accent); text-decoration: underline; }
  .team-badge {
    font-family: Oswald, system-ui, sans-serif;
    color: var(--ink-3); font-size: 0.76rem; letter-spacing: 0.06em;
  }
</style>

<div class="viz-root">
  <div class="wrap">
    <header class="page-head">
      <div class="eyebrow"><span id="season-title">—</span> 정규시즌</div>
      <h1>시즌별 스탯</h1>
      <p>선수 개인 기록(경기당 평균 + 고급 스탯)입니다. 상단에서 시즌을 고를 수 있고, 트레이드된 선수는 시즌 합산으로 통합했습니다. 선수명을 클릭하면 커리어 추이로 이동합니다.</p>
      <div class="nav-links">
        <a class="nav-link" href="__HOME_URL__">← 홈</a>
        <a class="nav-link" href="__NDL_URL__">NDL Score</a>
        <a class="nav-link" href="__PLAYER_URL__">선수 커리어</a>
        <a class="nav-link" href="__SCATTER_URL__">선수 포지셔닝</a>
        <a class="nav-link" href="__GAME_URL__">시즌 시뮬레이션</a>
      </div>
    </header>

    <section class="tiles" id="tiles"></section>

    <section class="controls">
      <select id="season-select"></select>
      <input type="text" id="search" placeholder="선수 또는 팀 검색…" />
      <select id="pos-filter">
        <option value="">전체 포지션</option>
      </select>
      <span class="count" id="count-label"></span>
    </section>

    <div class="table-scroll">
      <table id="stats-table">
        <thead>
          <tr id="thead-row"></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <footer class="page-foot">
      데이터 출처: basketball-reference.com (1949-50 ~ 2025-26 정규시즌) · 트레이드 선수는 이적 팀 합산 기준 · 이 페이지는 개인 분석 목적의 시범(trial) 페이지입니다.
    </footer>
  </div>
</div>

<script type="application/json" id="season-data">__SEASON_DATA__</script>
<script>
(function () {
  const DB = JSON.parse(document.getElementById('season-data').textContent);
  const SEASONS = DB.seasons; // 오래된 -> 최신 순, e.g. ["1949-50", ..., "2025-26"]
  let players = [];

  const PLAYER_URL = '__PLAYER_URL__';

  const columns = [
    { key: 'Player', label: '선수', numeric: false },
    { key: 'Team', label: '팀', numeric: false },
    { key: 'Pos', label: '포지션', numeric: false },
    { key: 'G', label: 'G', numeric: true, fmt: v => v.toFixed(0) },
    { key: 'MP', label: 'MP', numeric: true, fmt: v => v.toFixed(1) },
    { key: 'PTS', label: 'PTS', numeric: true, fmt: v => v.toFixed(1) },
    { key: 'TRB', label: 'TRB', numeric: true, fmt: v => v.toFixed(1) },
    { key: 'AST', label: 'AST', numeric: true, fmt: v => v.toFixed(1) },
    { key: 'STL', label: 'STL', numeric: true, fmt: v => v.toFixed(1) },
    { key: 'BLK', label: 'BLK', numeric: true, fmt: v => v.toFixed(1) },
    { key: 'FG%', label: 'FG%', numeric: true, fmt: v => (v * 100).toFixed(1) },
    { key: '3P%', label: '3P%', numeric: true, fmt: v => (v * 100).toFixed(1) },
    { key: 'TS%', label: 'TS%', numeric: true, fmt: v => (v * 100).toFixed(1) },
    { key: 'PER', label: 'PER', numeric: true, fmt: v => v.toFixed(1) },
    { key: 'WS', label: 'WS', numeric: true, fmt: v => v.toFixed(1) },
    { key: 'BPM', label: 'BPM', numeric: true, fmt: v => (v > 0 ? '+' : '') + v.toFixed(1) },
  ];

  let sortKey = 'PTS';
  let sortDir = -1;

  const seasonSelect = document.getElementById('season-select');
  SEASONS.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s + ' 시즌';
    seasonSelect.appendChild(opt);
  });
  seasonSelect.value = SEASONS[SEASONS.length - 1];
  seasonSelect.addEventListener('change', () => loadSeason(seasonSelect.value));

  const posFilter = document.getElementById('pos-filter');

  function loadSeason(season) {
    players = DB.stats[season] || [];
    document.getElementById('season-title').textContent = season;

    const posSet = Array.from(new Set(players.map(p => p.Pos).filter(Boolean))).sort();
    posFilter.innerHTML = '<option value="">전체 포지션</option>' +
      posSet.map(pos => `<option value="${pos}">${pos}</option>`).join('');

    renderTiles();
    renderHead();
    renderBody();
  }

  function renderTiles() {
    if (!players.length) { document.getElementById('tiles').innerHTML = ''; return; }
    const leaders = [
      { label: '득점 1위 (PTS)', key: 'PTS', fmt: v => v.toFixed(1) },
      { label: '리바운드 1위 (TRB)', key: 'TRB', fmt: v => v.toFixed(1) },
      { label: '어시스트 1위 (AST)', key: 'AST', fmt: v => v.toFixed(1) },
    ];
    const tiles = document.getElementById('tiles');
    tiles.innerHTML = '';
    leaders.forEach(l => {
      const top = players.reduce((a, b) => (b[l.key] ?? -Infinity) > (a[l.key] ?? -Infinity) ? b : a);
      const div = document.createElement('div');
      div.className = 'tile';
      div.innerHTML = `<div class="tile-label">${l.label}</div>
        <div class="tile-value">${l.fmt(top[l.key])}</div>
        <div class="tile-sub">${top.Player} · ${top.Team}</div>`;
      tiles.appendChild(div);
    });
  }

  function renderHead() {
    const row = document.getElementById('thead-row');
    row.innerHTML = '';
    columns.forEach(col => {
      const th = document.createElement('th');
      th.textContent = col.label;
      if (col.key === sortKey) {
        const arrow = document.createElement('span');
        arrow.className = 'arrow';
        arrow.textContent = sortDir === -1 ? '▼' : '▲';
        th.appendChild(arrow);
      }
      th.addEventListener('click', () => {
        if (sortKey === col.key) { sortDir *= -1; }
        else { sortKey = col.key; sortDir = col.numeric ? -1 : 1; }
        renderHead(); renderBody();
      });
      row.appendChild(th);
    });
  }

  function getFiltered() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    const pos = posFilter.value;
    return players.filter(p => {
      if (pos && p.Pos !== pos) return false;
      if (q && !(p.Player.toLowerCase().includes(q) || (p.Team || '').toLowerCase().includes(q))) return false;
      return true;
    });
  }

  function renderBody() {
    const rows = getFiltered().slice().sort((a, b) => {
      const av = a[sortKey], bv = b[sortKey];
      if (av == null && bv == null) return 0;
      if (av == null) return 1;
      if (bv == null) return -1;
      if (typeof av === 'string') return sortDir * av.localeCompare(bv);
      return sortDir * (av - bv);
    });
    const tbody = document.getElementById('tbody');
    document.getElementById('count-label').textContent = `${rows.length}명 표시`;
    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="${columns.length}"><div class="empty-state">조건에 맞는 선수가 없습니다.</div></td></tr>`;
      return;
    }
    tbody.innerHTML = rows.map(p => {
      return '<tr>' + columns.map(col => {
        if (col.key === 'Player') {
          const link = p.BbrefId ? `${PLAYER_URL}#${p.BbrefId}` : null;
          return `<td class="player-name">${link ? `<a href="${link}" target="_blank" rel="noopener">${p.Player}</a>` : p.Player}</td>`;
        }
        if (col.key === 'Team') return `<td><span class="team-badge">${p.TeamsPlayed && p.TeamsPlayed !== p.Team ? p.TeamsPlayed : p.Team}</span></td>`;
        if (col.key === 'Pos') return `<td>${p.Pos ?? ''}</td>`;
        const v = p[col.key];
        return `<td>${v == null ? '–' : col.fmt(v)}</td>`;
      }).join('') + '</tr>';
    }).join('');
  }

  document.getElementById('search').addEventListener('input', renderBody);
  posFilter.addEventListener('change', renderBody);

  loadSeason(seasonSelect.value);
})();
</script>
